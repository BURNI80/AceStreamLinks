<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE STREAM LINKS</title>
    <meta name="description" content="Directos de AceStream actualizados dinamicamente: F1, La Liga, DAZN, Movistar, ESPN, Eurosport y mas.">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-2: #292929;
            --surface-3: #333;
            --accent: #6200ea;
            --accent-hover: #3700b3;
            --accent-soft: #af76ff;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --border: #333;
            --green: #22c55e;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            max-width: 1400px;
            width: 100%;
            align-items: flex-start;
        }

        .sidebar {
            flex: 1;
            max-width: 300px;
            padding: 20px;
            box-sizing: border-box;
            position: sticky;
            top: 20px;
        }

        .content {
            flex: 2;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        header {
            width: 100%;
            max-width: 1400px;
            padding: 28px 20px 8px;
            box-sizing: border-box;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #6200ea, #af76ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header .subtitle {
            margin: 8px 0 0;
            color: var(--text-dim);
            font-size: 14px;
        }

        /* ---------------- Toolbar ---------------- */

        .toolbar {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }

        .toolbar-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search-box input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px 12px 40px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #6200ea33;
        }

        .search-box input::placeholder {
            color: #777;
        }

        .search-box svg {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            pointer-events: none;
        }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 11px 16px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background .15s, opacity .15s;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:disabled {
            opacity: .55;
            cursor: progress;
        }

        .btn-ghost {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .btn-ghost:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--text-dim);
            display: inline-block;
        }

        .status-dot.ok {
            background: var(--green);
            box-shadow: 0 0 8px #22c55e88;
        }

        .status-dot.err {
            background: var(--red);
        }

        .status-dot.loading {
            background: #eab308;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .25;
            }
        }

        /* ---------------- Chips de zonas ---------------- */

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }

        .chips::-webkit-scrollbar {
            height: 6px;
        }

        .chips::-webkit-scrollbar-thumb {
            background: var(--surface-3);
            border-radius: 3px;
        }

        .chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background .15s, color .15s, border-color .15s;
        }

        .chip:hover {
            color: var(--text);
            border-color: var(--accent);
        }

        .chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .chip .count {
            opacity: .65;
            margin-left: 6px;
            font-weight: 400;
        }

        /* ---------------- Zonas ---------------- */

        .zone {
            width: 100%;
            max-width: 900px;
            margin-bottom: 14px;
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #262626;
        }

        .zone-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            cursor: pointer;
            user-select: none;
            transition: background .15s;
            border-bottom: 1px solid transparent;
        }

        .zone-head:hover {
            background: var(--surface-2);
        }

        .zone.collapsed .zone-head {
            border-bottom: none;
        }

        .zone-arrow {
            color: var(--accent-soft);
            font-size: 11px;
            transform: rotate(90deg);
            transition: transform .2s;
            flex-shrink: 0;
        }

        .zone.collapsed .zone-arrow {
            transform: rotate(0deg);
        }

        .zone-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-soft);
            text-align: left;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .zone-count {
            background: var(--surface-2);
            color: var(--text-dim);
            font-size: 11.5px;
            padding: 3px 9px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .zone-body {
            display: block;
        }

        .zone.collapsed .zone-body {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
        }

        th,
        td {
            padding: 10px 16px;
            text-align: left;
            border-bottom: 1px solid #2b2b2b;
        }

        th {
            background: var(--surface-3);
            color: var(--text-dim);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .6px;
            font-weight: 700;
        }

        tbody tr:hover {
            background: var(--surface-2);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td.name {
            font-size: 14px;
            word-break: break-word;
        }

        .ch-id {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            color: #6f6f6f;
            word-break: break-all;
            margin-top: 3px;
        }

        .ch-id:hover {
            color: var(--accent-soft);
        }

        td.actions {
            width: 190px;
            white-space: nowrap;
            text-align: right;
        }

        .row-actions {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            justify-content: flex-end;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            transition: background .15s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-link {
            background-color: var(--accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: background .15s;
        }

        .btn-link:hover {
            background-color: var(--accent-hover);
        }

        .btn-copy {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 7px 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-copy:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .btn-copy.copied {
            border-color: var(--green);
            color: var(--green);
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5px;
            padding: 2px 7px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .badge.ace {
            background: #6200ea33;
            color: var(--accent-soft);
        }

        .badge.web {
            background: #ffffff12;
            color: var(--text-dim);
        }

        /* ---------------- Estados ---------------- */

        .hidden {
            display: none !important;
        }

        .state {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            color: var(--text-dim);
            font-size: 14px;
        }

        .state.error {
            color: #ff8a8a;
        }

        .skeleton {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skeleton-row {
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(90deg, #1e1e1e 25%, #262626 50%, #1e1e1e 75%);
            background-size: 200% 100%;
            animation: shimmer 1.3s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .empty {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
        }

        footer {
            width: 100%;
            max-width: 1400px;
            color: #666;
            font-size: 12px;
            padding: 24px 20px 40px;
        }

        /* ---------------- Responsive ---------------- */

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .sidebar {
                max-width: 100%;
                position: static;
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .content {
                padding: 12px;
            }

            header h1 {
                font-size: 22px;
            }

            th,
            td {
                padding: 9px 12px;
            }

            td.actions {
                width: auto;
            }

            .zone-title {
                font-size: 13.5px;
            }

            body {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>ACE STREAM LINKS</h1>
        <p class="subtitle">Canales en directo resueltos en tiempo real desde la red DNS de AceStream</p>
    </header>

    <div class="container">
        <!-- Barra lateral izquierda -->
        <aside class="sidebar">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7345993626465257"
                data-ad-slot="YYYYYYYYYY" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </aside>

        <!-- Contenido principal -->
        <main class="content">
            <div class="toolbar">
                <div class="toolbar-row">
                    <div class="search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="7" />
                            <line x1="16.5" y1="16.5" x2="21" y2="21" />
                        </svg>
                        <input type="text" id="search" placeholder="Buscar canal..." autocomplete="off"
                            spellcheck="false">
                    </div>
                    <button class="btn btn-ghost" id="toggle-all" title="Expandir o contraer todas las categorias">
                        Expandir todo
                    </button>
                    <button class="btn" id="refresh">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                            <polyline points="21 3 21 9 15 9" />
                        </svg>
                        Actualizar
                    </button>
                </div>

                <div class="toolbar-row">
                    <div class="status">
                        <span class="status-dot loading" id="status-dot"></span>
                        <span id="status-text">Consultando DNS...</span>
                    </div>
                </div>

                <div class="chips" id="chips"></div>
            </div>

            <div class="skeleton" id="skeleton">
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
            </div>

            <div class="state hidden" id="state"></div>
            <div class="empty hidden" id="empty">No hay canales que coincidan con la busqueda.</div>

            <div id="channels"></div>
        </main>

        <!-- Barra lateral derecha -->
        <aside class="sidebar">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7345993626465257"
                data-ad-slot="ZZZZZZZZZZ" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </aside>
    </div>

    <footer>
        Los enlaces se resuelven desde los registros DNS TXT de AceStream. Canal, enlace y disponibilidad pueden
        cambiar en cualquier momento.
    </footer>

    <script src="dns-resolver.js"></script>
    <script src="app.js"></script>
</body>

</html>
